
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeStep - Твой цифровой путь</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'system';
            const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primaryBlue: '#1e3c72',
                        secondaryBlue: '#2a5298',
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 3s cubic-bezier(0, 0, 0.2, 1) infinite',
                        'scanline': 'scanline 8s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out 2s infinite',
                        'spin-slow': 'spin 12s linear infinite',
                        'hologram': 'hologram 2s ease-in-out infinite',
                        'data-stream': 'dataStream 10s linear infinite',
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(1000%)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(5deg)' },
                        },
                        hologram: {
                            '0%, 100%': { opacity: '0.4', filter: 'brightness(1) contrast(1.2)' },
                            '50%': { opacity: '0.8', filter: 'brightness(1.5) contrast(1.5)' },
                        },
                        dataStream: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap');

        :root {
            --primary-blue: #1e3c72;
            --secondary-blue: #2a5298;
            --bg-color: #f7f7f2;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1a1a1a;
            --text-muted: #5f6368;
            --border-color: #ededdf;
        }

        .dark {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.4s ease;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        .hero-gradient {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff !important;
            perspective: 1000px;
        }

        .hero-gradient h1, .hero-gradient p, .hero-gradient span {
            color: #ffffff !important;
        }

        /* Side Cyber Elements - The "Gutters" */
        .side-decoration {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 100px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            display: none;
        }
        @media (min-width: 1024px) {
            .side-decoration { display: block; }
        }

        .side-left { left: 3vw; }
        .side-right { right: 3vw; }

        .data-pillar {
            height: 100%;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #3b82f6, transparent);
            position: relative;
            margin: 0 auto;
        }

        .data-node {
            width: 40px;
            height: 40px;
            border: 1px solid #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            transform: rotate(45deg);
            position: absolute;
            left: -19px;
            backdrop-filter: blur(4px);
        }

        .cyber-grid {
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            position: absolute;
            width: 200%;
            height: 100%;
            top: 0%;
            left: -50%;
            z-index: -1;
            mask-image: linear-gradient(to bottom, black, transparent);
            pointer-events: none;
        }

        .card-3d {
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-3d:hover {
            transform: translateY(-8px) rotateX(3deg) rotateY(-1deg);
        }

        .hologram-circle {
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2), inset 0 0 20px rgba(59, 130, 246, 0.1);
        }

        /* Container standardization */
        .container-box {
            max-width: 1040px;
            margin: -90px auto 90px;
            padding: 3rem;
            border-radius: 3rem;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 10;
        }
        @media (max-width: 768px) {
            .container-box { margin: -60px 16px 60px; padding: 1.5rem; border-radius: 2rem; }
        }

        .telegraph-content {
            max-width: 760px;
            margin: 0 auto;
            font-family: 'Lora', serif;
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--text-main);
        }
        
        .telegraph-content h2 {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            line-height: 1.1;
            letter-spacing: -0.05em;
        }

        .telegraph-content h3 {
            font-family: 'Inter', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin-top: 3rem;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        .scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            pointer-events: none;
            z-index: 20;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .certificate-card, .certificate-card * {
                visibility: visible;
            }
            .certificate-card {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",

}
</script>

</head>

    <div id="reading-progress"></div>

</html>
